services:
  api:
    build: .
    image: api-feedback:local
    ports:
      # Só na máquina local. Troque por "8000:8000" para expor na rede.
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Cache do Hugging Face fora do contêiner, para não baixar os modelos de
      # novo a cada recriação. Por padrão é um volume nomeado; para reaproveitar
      # o cache que já existe na sua máquina, defina no .env:
      #   HF_CACHE=/home/SEU_USUARIO/.cache/huggingface
      - ${HF_CACHE:-hf-cache}:/cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:
